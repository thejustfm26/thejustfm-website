
media:
  - name: uploads
    label: Photos and Posters
    input: media
    output: /media

content:
  - name: news
    label: News and Announcements
    type: collection
    path: content/news
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: News Headline
        type: string
        required: true
      - name: date
        label: Publication Date
        type: date
      - name: image
        label: News Photo
        type: image
      - name: body
        label: Article
        type: rich-text

  - name: programmes
    label: Radio Programmes
    type: collection
    path: content/programmes
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - name: title
        label: Programme Name
        type: string
        required: true
      - name: presenter
        label: Presenter
        type: string
      - name: schedule
        label: Broadcast Schedule
        type: string
      - name: description
        label: Description
        type: rich-text

  - name: partners
    label: Our Partners
    type: collection
    path: content/partners
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - name: name
        label: Partner Name
        type: string
        required: true
      - name: website
        label: Website
        type: string
      - name: phone
        label: Contact Number
        type: string
      - name: description
        label: Description
        type: text

settings:
  content:
    merge: true
